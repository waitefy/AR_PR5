<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Практика 5 — Three.js WebAR</title>
<style>
body { margin: 0; }
canvas { display: block; }
#overlay { position: fixed; inset: 0; pointer-events: none; }
#controls { position: absolute; bottom: 8px; left: 8px; right: 8px; pointer-events: auto; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="overlay">
    <div id="controls">
        <button id="ar" disabled>Войти в AR</button>
        <button id="left" aria-label="Повернуть влево на 15 градусов">−15°</button>
        <button id="right" aria-label="Повернуть вправо на 15 градусов">+15°</button>
        <label>Цвет <input id="color" type="color" value="#3b82f6"></label>
        <label>Модель <select id="model"><option value="box">Куб</option><option value="pyramid">Пирамида</option></select></label>
    </div>
</div>
<script>
const element = id => document.getElementById(id);

class Lighting {
    constructor(scene, renderer) {
        const studio = new THREE.Scene();
        studio.background = new THREE.Color(0x888888);
        const panel = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        panel.position.set(-1, 3, 0);
        studio.add(panel);
        const generator = new THREE.PMREMGenerator(renderer);
        scene.environment = generator.fromScene(studio).texture;
        generator.dispose();
        panel.geometry.dispose();
        panel.material.dispose();
    }
}

class Model {
    constructor(scene) {
        this.root = new THREE.Group();
        this.material = new THREE.MeshStandardMaterial({ color: '#3b82f6', roughness: 0.25, metalness: 0.65, flatShading: true });
        this.set('box');
        scene.add(this.root);
    }
    set(kind) {
        if (this.mesh) {
            this.root.remove(this.mesh);
            this.mesh.geometry.dispose();
        }
        const geometry = kind === 'box' ? new THREE.BoxGeometry(0.24, 0.24, 0.24) : new THREE.ConeGeometry(0.17, 0.24, 4).rotateY(Math.PI / 4);
        geometry.computeBoundingBox();
        this.mesh = new THREE.Mesh(geometry, this.material);
        this.mesh.position.y = -geometry.boundingBox.min.y;
        this.root.add(this.mesh);
    }
}

class Controls {
    constructor(model) {
        element('left').onclick = () => model.root.rotation.y -= Math.PI / 12;
        element('right').onclick = () => model.root.rotation.y += Math.PI / 12;
        element('color').oninput = event => model.material.color.set(event.target.value);
        element('model').onchange = event => model.set(event.target.value);
        element('controls').addEventListener('beforexrselect', event => event.preventDefault());
    }
}

class ARApp {
    constructor() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 30);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(innerWidth, innerHeight);
        this.renderer.outputEncoding = THREE.sRGBEncoding;
        this.renderer.xr.enabled = true;
        this.renderer.xr.setReferenceSpaceType('local-floor');
        document.body.appendChild(this.renderer.domElement);
        new Lighting(this.scene, this.renderer);
        this.model = new Model(this.scene);
        new Controls(this.model);
        this.reticle = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.13, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x00aa00, side: THREE.DoubleSide }));
        this.reticle.matrixAutoUpdate = false;
        this.reticle.visible = false;
        this.scene.add(this.reticle);
        const controller = this.renderer.xr.getController(0);
        controller.addEventListener('select', () => this.place());
        this.scene.add(controller);
        element('ar').onclick = () => this.toggleAR();
        this.renderer.xr.addEventListener('sessionend', () => this.preview());
        this.preview();
        if (isSecureContext && navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => { element('ar').disabled = !supported; }).catch(() => {});
        }
        window.onresize = () => {
            this.camera.aspect = innerWidth / innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(innerWidth, innerHeight);
        };
        this.renderer.setAnimationLoop((time, frame) => this.render(frame));
    }
    preview() {
        if (this.source) this.source.cancel();
        this.source = null;
        this.session = null;
        this.placed = false;
        this.reticle.visible = false;
        this.model.root.visible = true;
        this.model.root.position.set(0, 0, 0);
        this.camera.position.set(0.85, 0.65, 1.35);
        this.camera.lookAt(0, 0.12, 0);
        element('ar').textContent = 'Войти в AR';
    }
    async toggleAR() {
        element('ar').disabled = true;
        try {
            if (this.session) return await this.session.end();
            this.session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test', 'local-floor', 'dom-overlay'],
                domOverlay: { root: element('overlay') }
            });
            await this.renderer.xr.setSession(this.session);
            const viewer = await this.session.requestReferenceSpace('viewer');
            this.source = await this.session.requestHitTestSource({ space: viewer });
            this.model.root.visible = false;
            element('ar').textContent = 'Выйти из AR';
        } catch (error) {
            if (this.session) await this.session.end().catch(() => {});
            this.preview();
            console.error('Ошибка AR:', error);
        } finally {
            element('ar').disabled = false;
        }
    }
    place() {
        if (!this.session || this.placed || !this.reticle.visible) return;
        this.model.root.position.setFromMatrixPosition(this.reticle.matrix);
        this.model.root.visible = this.placed = true;
        this.reticle.visible = false;
    }
    render(frame) {
        if (frame && this.source && !this.placed) {
            const hits = frame.getHitTestResults(this.source);
            const pose = hits.length ? hits[0].getPose(this.renderer.xr.getReferenceSpace()) : null;
            this.reticle.visible = Boolean(pose);
            if (pose) this.reticle.matrix.fromArray(pose.transform.matrix);
        }
        this.renderer.render(this.scene, this.camera);
    }
}

try { new ARApp(); }
catch (error) { console.error('Ошибка сцены:', error); }
</script>
</body>
</html>
