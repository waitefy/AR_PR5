<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js WebXR Interactive Scene (ПР5)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        #ar-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; z-index: 20; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <button id="ar-btn">Войти в AR</button>
    <script>
        let hitTestSource = null, hitTestSourceRequested = false, spawnedObject = null, colorIndex = 0;
        const colors = [0x3b82f6, 0x10b981, 0xf59e0b, 0xef4444, 0x8b5cf6];
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(0.5, 2, 0.5);
        scene.add(light);

        const reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.1, 0.13, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const material = new THREE.MeshStandardMaterial({ color: colors[0], roughness: 0.2, metalness: 0.85 });
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', () => {
            if (!spawnedObject && reticle.visible) {
                spawnedObject = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.25, 32), material);
                spawnedObject.position.setFromMatrixPosition(reticle.matrix);
                spawnedObject.position.y += 0.125;
                scene.add(spawnedObject);
            } else if (spawnedObject) {
                colorIndex = (colorIndex + 1) % colors.length;
                material.color.setHex(colors[colorIndex]);
            }
        });
        scene.add(controller);

        const arBtn = document.getElementById('ar-btn');
        if (!("xr" in navigator)) arBtn.disabled = true;
        else navigator.xr.isSessionSupported("immersive-ar").then(sup => arBtn.disabled = !sup);

        arBtn.addEventListener('click', async () => {
            const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay', 'local-floor'],
                domOverlay: { root: document.body }
            });

            renderer.xr.setReferenceSpaceType('local');
            await renderer.xr.setSession(session);
            arBtn.style.display = 'none';

            session.addEventListener('end', () => {
                hitTestSource = null;
                hitTestSourceRequested = false;
                arBtn.style.display = 'block';
            });
        });

        renderer.setAnimationLoop((timestamp, frame) => {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested && session) {
                    session.requestReferenceSpace('viewer').then(viewerSpace => {
                        session.requestHitTestSource({ space: viewerSpace }).then(source => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource && referenceSpace) {
                    const hits = frame.getHitTestResults(hitTestSource);
                    if (hits.length > 0) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(hits[0].getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            if (spawnedObject) spawnedObject.rotation.y += 0.02;
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
